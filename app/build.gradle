plugins { id 'com.android.application' }
android {
    compileSdk 34
    defaultConfig {
        applicationId "com.pdfreader"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'
}
